name: Deploy Dual Web Applications to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 1. Build App 1: School Fee System
      - name: Build School Fee Frontend (App 1)
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      # 2. Build App 2: Boarder Pocket Money System
      - name: Build Pocket Money Frontend (App 2)
        run: |
          cd pocket_money_system/frontend
          npm install --legacy-peer-deps
          npm run build

      # 3. Combine both web apps for single GitHub Pages deployment
      - name: Combine Web Applications
        run: |
          mkdir -p frontend/dist/pocket
          cp -r pocket_money_system/frontend/dist/* frontend/dist/pocket/

      # 4. Upload GitHub Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

