name: Deploy Frontend Apps to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Main School Fee Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Pocket Money Frontend
        run: |
          cd pocket_money_system/frontend
          npm ci
          npm run build

      - name: Assemble Combined Site
        run: |
          mkdir -p public_site
          cp -r frontend/dist/* public_site/
          mkdir -p public_site/pocket-money
          cp -r pocket_money_system/frontend/dist/* public_site/pocket-money/
          cp frontend/vercel.json public_site/ 2>/dev/null || true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
